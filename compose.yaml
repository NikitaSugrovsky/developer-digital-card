services:
  postgres:
    image: postgres:16-alpine
    container_name: devcard-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-NewPass123}
      POSTGRES_DB: ${POSTGRES_DB:-developer_card}
    ports:
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-developer_card}"]
      interval: 3s
      timeout: 3s
      retries: 20
      start_period: 5s

  app:
    build: .
    container_name: devcard-app
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: 3000
      DATABASE_URL: postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-NewPass123}@postgres:5432/${POSTGRES_DB:-developer_card}?schema=public
    ports:
      - "3000:3000"
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  pgdata:
